# Gloryphone nginx 配置
# 放到 /etc/nginx/conf.d/gloryphone.conf（或 sites-available 并软链），然后 nginx -t && nginx -s reload。
#
# 站点：
#   gloryphone.u4a.cn        默认 → www(本机:3000 Nuxt SSR)；/my → 静态 SPA；/api → 后端(本机:9981)
#   admin-gloryphone.u4a.cn  → admin 静态 SPA；/api → 后端(本机:9981)

# WebSocket 升级（Nuxt SSR / 可能的 WS）。map 必须在 http 上下文，本文件被 conf.d 引入即在 http 内。
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream gloryphone_backend { server 127.0.0.1:9981; }
upstream gloryphone_www     { server 127.0.0.1:3000; }

# ───────────────────────── 前台站点：gloryphone.u4a.cn ─────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name gloryphone.u4a.cn;

  # APK / 文件上传走 /api，放开 body 限制（后端上传超时 300s）。
  client_max_body_size 4096m;

  access_log /var/log/nginx/gloryphone.access.log;
  error_log  /var/log/nginx/gloryphone.error.log;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 后端接口：/api/* 原样透传到 9981（路径不变）。
  location /api/ {
    proxy_pass http://gloryphone_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_request_buffering off;   # 大文件上传边收边转，避免落临时盘
  }

  # /my：用户中心静态 SPA（构建时 base=/my/，资源在 /my/assets/...）。
  # 带 hash 的静态资源长缓存（更具体的前缀，优先于下面的 /my/）。
  location /my/assets/ {
    alias /var/www/gloryphone/my/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }
  location = /my { return 301 /my/; }
  location /my/ {
    alias /var/www/gloryphone/my/;
    try_files $uri $uri/ /my/index.html;   # SPA history 回退到 /my/index.html
  }

  # 其余全部 → www（Nuxt SSR，本机 3000）。
  location / {
    proxy_pass http://gloryphone_www;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
  }
}

# ───────────────────────── 后台站点：admin-gloryphone.u4a.cn ─────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name admin-gloryphone.u4a.cn;

  client_max_body_size 4096m;

  access_log /var/log/nginx/admin-gloryphone.access.log;
  error_log  /var/log/nginx/admin-gloryphone.error.log;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  root /var/www/gloryphone/admin;
  index index.html;

  # 后端接口：与前台一致，透传到 9981。
  location /api/ {
    proxy_pass http://gloryphone_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_request_buffering off;
  }

  # 带 hash 的静态资源长缓存。
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # admin 静态 SPA（base=/，子域名根路径），history 回退到 /index.html。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
