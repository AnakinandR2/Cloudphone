securityDefinitions:
    ApiKeyAuth:
        description: 内容中台 pub 接口的接入凭证（在后台 workspace 下签发）。
        in: header
        name: X-API-Key
        type: apiKey
    Bearer:
        description: Type "Bearer" followed by a space and JWT token.
        in: header
        name: Authorization
        type: apiKey
