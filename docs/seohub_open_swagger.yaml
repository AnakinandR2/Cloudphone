                                    type: array
                              type: object
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/framework.Response'
            security:
                - ApiKeyAuth: []
            summary: 列出已发布 API 文档
            tags:
                - API 文档
    /api-docs/{slug}/spec:
        get:
            description: "\U0001F511 只读 key · 按 scopes 可见性 ｜ 按 slug 返回已发布 API 文档的原始 OpenAPI 文档（直接返回 spec 原文，非 JSON 信封；支持 ETag/If-None-Match 缓存）。多语言按回退链（请求语→全局→en）解析"
            parameters:
                - description: API 文档 slug
                  in: path
                  name: slug
                  required: true
                  type: string
                - description: 语言码（如 zh-CN/en）；回退链：请求语→全局→en
                  in: query
                  name: lang
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OpenAPI 文档原文
                    schema:
                        type: string
                "304":
                    description: 未修改（命中 If-None-Match）
                    schema:
                        type: string
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/framework.Response'
                "403":
                    description: Forbidden
                    schema:
                        $ref: '#/definitions/framework.Response'
                "404":
                    description: Not Found
                    schema:
                        $ref: '#/definitions/framework.Response'
            security:
                - ApiKeyAuth: []
