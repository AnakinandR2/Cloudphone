basePath: /api/open/v1
definitions:
    article.ArticleCreateReq:
        properties:
            first_translation:
                allOf:
                    - $ref: '#/definitions/article.TranslationPayload'
                description: 首个语言翻译（必填）
            group_id:
                description: 目录分组节点 ID，可为空（提供则把文章放入该分组）
                example: 3
                type: integer
            path:
                description: 相对子路径，可为空
                example: blog/hello-world
                type: string
            published_at:
                description: 发布时间，可为空
                type: string
            slug:
                description: URL 友好标识（必填）
                example: hello-world
                type: string
            status:
                allOf:
                    - $ref: '#/definitions/article.Status'
                description: 状态：draft / published
                example: draft
            tag_ids:
                description: 关联标签 ID 列表
                items:
                    type: integer
                type: array
        required:
            - first_translation
            - slug
        type: object
    article.ArticleDetailView:
        properties:
            created_at:
                description: 创建时间
                type: string
            created_by_staff_id:
                description: 创建者 staff ID
                example: 1
                type: integer
            full_url:
                description: 完整 URL
                type: string
            group:
                allOf:
                    - $ref: '#/definitions/article.GroupBrief'
                description: 所属目录分组（= 分类，精简）
            group_id:
                description: 所属目录分组节点 ID
                type: integer
            id:
                description: 文章 ID
                example: 1
                type: integer
            path:
                description: 相对子路径
                type: string
            published_at:
                description: 发布时间
                type: string
            slug:
                description: slug
                example: hello-world
                type: string
            space_id:
                description: 所属内容空间 ID
                example: 1
                type: integer
            status:
                allOf:
                    - $ref: '#/definitions/article.Status'
                description: 状态：draft / published
                example: published
            tag_ids:
                description: 关联标签 ID 列表
                items:
                    type: integer
                type: array
            tags:
                description: 关联标签（精简）
                items:
                    $ref: '#/definitions/article.TagBrief'
                type: array
            translations:
                description: 全部语言翻译
                items:
                    $ref: '#/definitions/article.TranslationView'
                type: array
            updated_at:
                description: 更新时间
                type: string
            workspace_id:
                description: 所属 Workspace ID
                example: 1
                type: integer
        type: object
    article.ArticleDirectoryNode:
        properties:
            article_id:
                description: |-
                    ArticleID 仅 kind=article 非空；(space_id, article_id) 唯一 → 一文最多入树一次。
                    NULL 不计入唯一约束，故多个 group 节点可并存。
                type: integer
            collapsed:
                description: 是否默认折叠（仅分组有意义）
                example: false
                type: boolean
            created_at:
                description: 创建时间
                type: string
            id:
                description: 节点 ID
                example: 1
                type: integer
            kind:
                allOf:
                    - $ref: '#/definitions/article.DirNodeKind'
                description: 节点类型：group 分组 / article 文章
                example: group
            parent_id:
                description: 父节点 ID，可为空（顶级）
                type: integer
            path:
                description: Path：分组聚合页相对 Space.base_url 的子路径（空间内唯一，service 层校验，与文章 path 同命名空间）。
                example: guides
                type: string
            slug:
                description: Slug：分组的正式 slug（空间内 group 唯一，service 层校验）；article 节点不用。
                example: getting-started
                type: string
            sort:
                description: 同级排序，越小越靠前
                example: 0
                type: integer
            space_id:
                description: 所属内容空间 ID
                example: 1
                type: integer
            updated_at:
                description: 更新时间
                type: string
            workspace_id:
                description: 所属 Workspace ID
                example: 1
                type: integer
        type: object
    article.ArticleDirectoryNodeTranslation:
        properties:
            created_at:
                description: 创建时间
                type: string
            lang:
                description: 语言代码
                example: zh-CN
                type: string
            name:
                description: 该语言下的分组标题
                example: 快速开始
                type: string
            node_id:
                description: 所属节点 ID
                example: 1
                type: integer
            updated_at:
                description: 更新时间
                type: string
        type: object
    article.ArticleTag:
        properties:
            created_at:
                description: 创建时间
                type: string
            id:
                description: 标签 ID
                example: 1
                type: integer
            path:
                description: 前台聚合页相对 URL，可为空
                example: tag/golang
                type: string
            slug:
                description: URL 友好标识，空间内唯一
                example: golang
                type: string
            space_id:
                description: 所属内容空间 ID
                example: 1
                type: integer
            updated_at:
                description: 更新时间
                type: string
            workspace_id:
                description: 所属 Workspace ID
                example: 1
                type: integer
        type: object
    article.ArticleTagTranslation:
        properties:
            created_at:
                description: 创建时间
                type: string
            lang:
                description: 语言代码
                example: zh-CN
                type: string
            name:
                description: 该语言下的标签名
                example: Go 语言
                type: string
            tag_id:
                description: 所属标签 ID
                example: 1
                type: integer
            updated_at:
                description: 更新时间
                type: string
        type: object
    article.ArticleUpdateReq:
        properties:
            clear_group:
                description: 置为 true 时把文章移出目录树（未分类）
                type: boolean
            clear_path:
                description: 置为 true 时清空 path
                type: boolean
            clear_published_at:
                description: 置为 true 时清空 published_at
                type: boolean
            group_id:
                description: 目录分组节点 ID（提供则把文章放/移到该分组）
                type: integer
            path:
                description: 相对子路径
                type: string
            published_at:
                description: 发布时间
                type: string
            slug:
                description: URL 友好标识
                example: hello-world
                type: string
            status:
                allOf:
                    - $ref: '#/definitions/article.Status'
                description: 状态：draft / published
                example: published
            tag_ids:
                description: 关联标签 ID 列表（整组覆盖）
                items:
                    type: integer
                type: array
        type: object
    article.BodyFormat:
        enum:
            - markdown
            - html
            - json
        type: string
        x-enum-varnames:
            - BodyMarkdown
            - BodyHTML
            - BodyJSON
    article.DirArticleBrief:
        properties:
            id:
                description: 文章 ID
                example: 1
                type: integer
            slug:
                description: slug
                example: hello-world
                type: string
            status:
                allOf:
                    - $ref: '#/definitions/article.Status'
                description: 状态：draft / published
                example: draft
            title:
                description: 标题
                example: 你好世界
                type: string
        type: object
    article.DirNodeCreateReq:
        properties:
            article_id:
                description: 指向的文章 ID（kind=article 必填）
                type: integer
            collapsed:
                description: 是否默认折叠
                example: false
                type: boolean
            group_name:
                description: 分组标题（kind=group 必填）
                example: 快速开始
                type: string
            kind:
                allOf:
                    - $ref: '#/definitions/article.DirNodeKind'
                description: 节点类型：group / article（必填）
                example: group
            lang:
                description: 初始翻译语言（kind=group 必填）
                example: zh-CN
                type: string
            parent_id:
                description: 父节点 ID，可为空（顶级）
                type: integer
            path:
                description: 分组落地页相对 URL（kind=group 可选）
                example: guides
                type: string
            slug:
                description: 分组 slug（kind=group 可选，空间内唯一）
                example: getting-started
                type: string
        required:
            - kind
        type: object
    article.DirNodeKind:
        enum:
            - group
            - article
        type: string
        x-enum-varnames:
            - DirKindGroup
            - DirKindArticle
    article.DirNodeUpdateReq:
        properties:
            clear_path:
                description: 置为 true 时清空 path
                type: boolean
            clear_slug:
                description: 置为 true 时清空 slug
                type: boolean
            collapsed:
                description: 是否默认折叠
                type: boolean
            path:
                description: 分组落地页相对 URL
                example: guides
                type: string
            slug:
                description: 分组 slug
                example: getting-started
                type: string
        type: object
    article.DirNodeView:
        properties:
            article_count:
                description: 递归文章数量（含子分组、排除软删/悬空）
                example: 5
                type: integer
            article_id:
                description: article 节点
                type: integer
            child_group_count:
                description: group 节点懒加载计数（仅 group 节点；ListChildren 填充）
                example: 2
                type: integer
            children:
                description: 子节点
                items:
                    $ref: '#/definitions/article.DirNodeView'
                type: array
            collapsed:
                description: 是否默认折叠
                example: false
                type: boolean
            full_url:
                description: 文章完整 URL（仅 article 节点）
                type: string
            group_full_url:
                description: 分组落地页完整 URL（仅 group 且有 path）
                type: string
            id:
                description: 节点 ID
                example: 1
                type: integer
            kind:
                allOf:
                    - $ref: '#/definitions/article.DirNodeKind'
                description: 节点类型：group / article
                example: group
            parent_id:
                description: 父节点 ID
                type: integer
            path:
                description: 分组落地页相对 URL
                example: guides
                type: string
            published_at:
                description: 文章发布时间（仅 article 节点）
                type: string
            slug:
                description: 分组 slug
                example: getting-started
                type: string
            sort:
                description: 同级排序
                example: 0
                type: integer
            status:
                allOf:
                    - $ref: '#/definitions/article.Status'
                description: 文章状态（仅 article 节点）
                example: published
            title:
                description: 通用：group=分组名 fallback；article=文章标题 fallback
                example: 快速开始
                type: string
            translations:
                description: group 节点多语言（admin 编辑用）
                items:
                    $ref: '#/definitions/article.ArticleDirectoryNodeTranslation'
                type: array
        type: object
    article.DirReorderItem:
        properties:
            id:
                description: 节点 ID（必填）
                example: 1
                type: integer
            parent_id:
                description: 新父节点 ID，可为空（顶级）
                type: integer
            sort:
                description: 新的同级排序
                example: 0
                type: integer
        required:
            - id
        type: object
    article.DirReorderReq:
        properties:
            items:
                description: 重排项列表（必填）
                items:
                    $ref: '#/definitions/article.DirReorderItem'
                type: array
        required:
            - items
        type: object
    article.DirStaffView:
        properties:
            tree:
                description: 目录树（嵌套）
                items:
                    $ref: '#/definitions/article.DirNodeView'
                type: array
            unplaced:
                description: 未归入目录树的文章
                items:
                    $ref: '#/definitions/article.DirArticleBrief'
                type: array
        type: object
    article.FeedbackReq:
        properties:
            contact:
                description: 可选联系方式
                example: me@example.com
                type: string
            content:
                description: 反馈正文（必填）
                example: 这一段链接失效了
                type: string
            ip:
                description: 终端访客 IP（业务传入；空则回退 ClientIP）
                example: 203.0.113.7
                type: string
            lang:
                description: 所在语言版本
                example: zh-CN
                type: string
            meta:
                description: 业务透传身份上下文
                example: vip:gold
                type: string
            rating:
                description: 提交时的打分快照（可选）
                example: 4
                type: integer
            user_agent:
                description: 终端 UA（业务传入；空则回退请求头）
                type: string
            visitor_id:
                description: 访客标识，可空
                example: v-abc123
                type: string
            vote:
                description: 提交时的赞踩快照（可选）
                example: 1
                type: integer
        required:
            - content
        type: object
    article.FeedbackSummary:
        properties:
            down_count:
                description: 点踩数
                example: 2
                type: integer
            feedback_count:
                description: 文本反馈条数
                example: 5
                type: integer
            my_reaction:
                allOf:
                    - $ref: '#/definitions/article.MyReaction'
                description: 当前访客的反应（带 visitor_id 时）
            rating_avg:
                description: 平均分（仅计 rating>0）
                example: 4.2
                type: number
            rating_count:
                description: 评分人数
                example: 15
                type: integer
            rating_dist:
                description: 1–5 各分桶计数（下标 0=1星）
                items:
                    type: integer
                type: array
            up_count:
                description: 点赞数
                example: 30
                type: integer
        type: object
    article.GroupBrief:
        properties:
            full_url:
                description: 分组聚合页完整 URL（Space.base_url + '/' + path），无 path 则空
                type: string
            id:
                description: 分组（目录节点）ID
                example: 1
                type: integer
            name:
                description: 当前语言下的分组名
                example: 使用指南
                type: string
            slug:
                description: 分组 slug
                example: guides
                type: string
        type: object
    article.MyReaction:
        properties:
            rating:
                description: 0–5
                example: 4
                type: integer
            vote:
                description: -1 / 0 / 1
                example: 1
                type: integer
        type: object
    article.PubArticleView:
        properties:
            available_langs:
                description: 可用语言列表（仅详情返回）
                items:
                    type: string
                type: array
            body_html:
                description: 渲染后的 HTML 正文（仅详情返回）
                type: string
            cover_alt:
                description: 封面图替代文本
                type: string
            cover_url:
                description: 封面图 URL
                type: string
            created_at:
                description: 创建时间
                type: string
            full_url:
                description: 完整 URL
                type: string
            group:
                allOf:
                    - $ref: '#/definitions/article.GroupBrief'
                description: 所属目录分组（= 分类，精简）
            id:
                description: 文章 ID
                example: 1
                type: integer
            lang:
                description: 当前语言
                example: zh-CN
                type: string
            path:
                description: 相对子路径
                type: string
            published_at:
                description: 发布时间
                type: string
            seo_description:
                description: SEO 描述
                type: string
            seo_keywords:
                description: SEO 关键字
                type: string
            seo_title:
                description: SEO 标题
                type: string
            slug:
                description: slug
                example: hello-world
                type: string
            summary:
                description: 摘要
                type: string
            tags:
                description: 关联标签（精简）
                items:
                    $ref: '#/definitions/article.TagBrief'
                type: array
            title:
                description: 标题
                example: 你好世界
                type: string
            updated_at:
                description: 更新时间
                type: string
        type: object
    article.PubDirNode:
        properties:
            children:
                description: 子节点
                items:
                    $ref: '#/definitions/article.PubDirNode'
                type: array
            collapsed:
                description: 是否默认折叠
                example: false
                type: boolean
            kind:
                allOf:
                    - $ref: '#/definitions/article.DirNodeKind'
                description: 节点类型：group / article
                example: group
            slug:
                description: 锚点 slug
                example: getting-started
                type: string
            title:
                description: 标题
                example: 快速开始
                type: string
            url:
                description: 文章完整 URL（仅 article 节点）
                type: string
        type: object
    article.ReactionReq:
        properties:
            ip:
                description: 终端访客 IP（业务传入；空则服务端回退 ClientIP）
                example: 203.0.113.7
                type: string
            lang:
                description: 反应来自的语言版本
                example: zh-CN
                type: string
            meta:
                description: 业务透传身份上下文
                example: vip:gold
                type: string
            rating:
                description: 1–5；0 表示清除打分；省略=不改
                example: 4
                type: integer
            user_agent:
                description: 终端 UA（业务传入；空则回退请求头）
                type: string
            visitor_id:
                description: 访客标识（前台 cookie UUID 或自定义用户标识）
                example: v-abc123
                type: string
            vote:
                description: -1 踩 / 1 赞；0 表示清除投票；省略=不改
                example: 1
                type: integer
        required:
            - visitor_id
        type: object
    article.Status:
        enum:
            - draft
            - published
        type: string
        x-enum-varnames:
            - StatusDraft
            - StatusPublished
    article.TagBrief:
        properties:
            id:
                description: 标签 ID
                example: 2
                type: integer
            name:
                description: 当前语言下的标签名
                example: Go 语言
                type: string
            slug:
                description: 标签 slug
                example: golang
                type: string
        type: object
    article.TagCreateReq:
        properties:
            lang:
                description: 初始语言代码（必填）
                example: zh-CN
                type: string
            name:
                description: 初始语言下的标签名（必填）
                example: Go 语言
                type: string
            path:
                description: 前台聚合页相对 URL，可为空
                example: tag/golang
                type: string
            slug:
                description: URL 友好标识（必填）
                example: golang
                type: string
        required:
            - lang
            - name
            - slug
        type: object
    article.TagUpdateReq:
        properties:
            clear_path:
                description: 置为 true 时清空 path
                type: boolean
            path:
                description: 前台聚合页相对 URL
                type: string
            slug:
                description: URL 友好标识
                example: golang
                type: string
        type: object
    article.TagView:
        properties:
            article_count:
                description: 未删的、关联本标签的文章数
                example: 5
                type: integer
            created_at:
                description: 创建时间
                type: string
            full_url:
                description: 前台聚合页完整 URL
                type: string
            id:
                description: 标签 ID
                example: 1
                type: integer
            name:
                description: 按请求 lang fallback 的标签名
                example: Go 语言
                type: string
            path:
                description: 前台聚合页相对 URL，可为空
                example: tag/golang
                type: string
            slug:
                description: URL 友好标识，空间内唯一
                example: golang
                type: string
            space_id:
                description: 所属内容空间 ID
                example: 1
                type: integer
            translation_count:
                description: 翻译数
                example: 2
                type: integer
            translations:
                description: 全部语言翻译
                items:
                    $ref: '#/definitions/article.ArticleTagTranslation'
                type: array
            updated_at:
                description: 更新时间
                type: string
            workspace_id:
                description: 所属 Workspace ID
                example: 1
                type: integer
        type: object
    article.TaxonomyTranslationUpsertReq:
        properties:
            name:
                description: 该语言下的名称（必填）
                example: 使用指南
                type: string
        required:
            - name
        type: object
    article.TranslationPayload:
        properties:
            body_format:
                allOf:
                    - $ref: '#/definitions/article.BodyFormat'
                description: 正文源格式：markdown / html / json（必填）
                example: markdown
            body_html:
                description: 渲染后的 HTML 正文
                type: string
            body_raw:
                description: 正文源内容
                type: string
            cover_alt:
                description: 封面图替代文本
                example: 封面替代文本
                type: string
            cover_url:
                description: 封面图 URL
                example: https://cdn.example.com/cover.png
                type: string
            lang:
                description: 语言代码（必填）
                example: zh-CN
                type: string
            seo_description:
                description: SEO 描述
                type: string
            seo_keywords:
                description: SEO 关键字
                type: string
            seo_title:
                description: SEO 标题
                type: string
            summary:
                description: 摘要
                example: 这是一篇示例文章
                type: string
            title:
                description: 标题（必填）
                example: 你好世界
                type: string
        required:
            - body_format
            - lang
            - title
        type: object
    article.TranslationUpdateReq:
        properties:
            body_format:
                allOf:
                    - $ref: '#/definitions/article.BodyFormat'
                description: 正文源格式：markdown / html / json
                example: markdown
            body_html:
                description: 渲染后的 HTML 正文
                type: string
            body_raw:
                description: 正文源内容
                type: string
            cover_alt:
                description: 封面图替代文本
                type: string
            cover_url:
                description: 封面图 URL
                type: string
            seo_description:
                description: SEO 描述
                type: string
            seo_keywords:
                description: SEO 关键字
                type: string
            seo_title:
                description: SEO 标题
                type: string
            summary:
                description: 摘要
                type: string
            title:
                description: 标题
                example: 新标题
                type: string
        type: object
    article.TranslationView:
        properties:
            article_id:
                description: 所属文章 ID
                example: 1
                type: integer
            body_format:
                allOf:
                    - $ref: '#/definitions/article.BodyFormat'
