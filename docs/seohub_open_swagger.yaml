host: localhost:9981
info:
    contact: {}
    description: "内容中台对外 API。所有接口用 `X-API-Key` 鉴权，按 key 能力分两类场景：\n\n- **只读 key**：前台业务取数（消费读按 key 的 `scopes` 可见性过滤）、AI 读取内容。\n- **可写 key（editor+ 角色）**：交给 AI / MCP 做内容创作——写文章、传图配图、管理分类标签目录。\n\nkey 在后台「工作空间 → API Keys」创建，可设角色（viewer/editor/owner）与 scopes，创建后可随时重看明文。每个接口标题下首行（\U0001F511）标注所需 key。\n\n---\n\nContent platform external API. All endpoints authenticate via `X-API-Key`, split into two scenarios by key capability:\n\n- **Read-only key**: frontend data fetching (consumer reads filtered by the key's `scopes` visibility) and AI reading.\n- **Write key (editor+ role)**: hand to AI / MCP for content authoring — write articles, upload images, manage taxonomy.\n\nCreate keys under \"Workspace → API Keys\" in the admin; each request's first description line (\U0001F511) marks the key it needs."
    title: 内容中台对外 API
    version: "1.0"
paths:
    /api-docs:
        get:
            description: "\U0001F511 只读 key · 按 scopes 可见性 ｜ 列出当前 API Key 可访问且已发布（published）的 API 文档（按 key.scopes 与文档可见性过滤；仅返回安全字段）。多语言按 slug 去重，每 slug 用回退链（请求语→全局→en）选一条"
            parameters:
                - description: 语言码（如 zh-CN/en）；回退链：请求语→全局→en
                  in: query
                  name: lang
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
