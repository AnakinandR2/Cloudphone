info:
  contact: {}
  description: >-
    内容中台对外 API。所有接口用 `X-API-Key` 鉴权，按 key 能力分两类场景：


    - **只读 key**：前台业务取数（消费读按 key 的 `scopes` 可见性过滤）、AI 读取内容。

    - **可写 key（editor+ 角色）**：交给 AI / MCP 做内容创作——写文章、传图配图、管理分类标签目录。


    key 在后台「工作空间 → API Keys」创建，可设角色（viewer/editor/owner）与
    scopes，创建后可随时重看明文。每个接口标题下首行（🔑）标注所需 key。


    文章正文 `body_html` 可含「内嵌占位（embed
    placeholder）」——中台交付干净占位、由业务前台浏览器端识别并改写，用法与契约见帮助中心《正文内嵌占位（Embed 占位）》一文。


    ---


    Content platform external API. All endpoints authenticate via `X-API-Key`,
    split into two scenarios by key capability:


    - **Read-only key**: frontend data fetching (consumer reads filtered by the
    key's `scopes` visibility) and AI reading.

    - **Write key (editor+ role)**: hand to AI / MCP for content authoring —
    write articles, upload images, manage taxonomy.


    Create keys under "Workspace → API Keys" in the admin; each request's first
    description line (🔑) marks the key it needs.
  title: 内容中台对外 API
  version: "1.0"
paths:
  /api-docs:
    get:
      description: 🔑 只读 key · 按 scopes 可见性 ｜ 列出当前 API Key 可访问且已发布（published）的 API
        文档（按 key.scopes 与文档可见性过滤；仅返回安全字段）。多语言按 slug 去重，每 slug 用回退链（请求语→全局→en）选一条
      parameters:
        - description: 语言码（如 zh-CN/en）；回退链：请求语→全局→en
          in: query
          name: lang
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    items:
                      $ref: "#/definitions/internal.PubApiDocBrief"
                    type: array
                type: object
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/framework.Response"
      security:
        - ApiKeyAuth: []
      summary: 列出已发布 API 文档
      tags:
        - API 文档
  /api-docs/{slug}/spec:
    get:
      description: 🔑 只读 key · 按 scopes 可见性 ｜ 按 slug 返回已发布 API 文档的原始 OpenAPI 文档（直接返回
        spec 原文，非 JSON 信封；支持 ETag/If-None-Match 缓存）。多语言按回退链（请求语→全局→en）解析
      parameters:
        - description: API 文档 slug
          in: path
          name: slug
          required: true
          type: string
        - description: 语言码（如 zh-CN/en）；回退链：请求语→全局→en
          in: query
          name: lang
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OpenAPI 文档原文
          schema:
            type: string
        "304":
          description: 未修改（命中 If-None-Match）
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/framework.Response"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/framework.Response"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/framework.Response"
      security:
        - ApiKeyAuth: []
      summary: 获取 API 文档 spec 原文
      tags:
        - API 文档
