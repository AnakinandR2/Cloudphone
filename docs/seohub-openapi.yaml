basePath: /api/open/v1
definitions:
  article.ArticleCreateReq:
    properties:
      author_id:
        description: 关联作者 ID，可为空
        type: integer
      first_translation:
        allOf:
          - $ref: "#/definitions/article.TranslationPayload"
        description: 首个语言翻译（必填）
      group_id:
        description: 目录分组节点 ID，可为空（提供则把文章放入该分组）
        example: 3
        type: integer
      path:
        description: 相对子路径（必填，拼接到 base_url 后构成唯一 URL）
        example: blog/hello-world
        type: string
      published_at:
        description: 发布时间，可为空
        type: string
      slug:
        description: URL 友好标识（必填）
        example: hello-world
        type: string
      status:
        allOf:
          - $ref: "#/definitions/article.Status"
        description: 状态：draft / published
        example: draft
      tag_ids:
        description: 关联标签 ID 列表
        items:
          type: integer
        type: array
    required:
      - first_translation
      - path
      - slug
    type: object
  article.ArticleDetailView:
    properties:
      author:
        allOf:
          - $ref: "#/definitions/manager-backend_modules_author.AuthorView"
        description: 关联作者（按 lang 内嵌；开放面无独立作者接口，靠此直接展示；作者被删则空）
      author_id:
        description: 关联作者 ID（admin 前端可经作者库 store join）
        type: integer
      coverage:
        allOf:
          - $ref: "#/definitions/article.LangCoverage"
        description: 语言覆盖（相对空间 SupportedLangs：covered/missing）
      created_at:
        description: 创建时间
        format: date-time
        type: string
      created_by_staff_id:
        description: 创建者 staff ID
        example: 1
        type: integer
      full_url:
        description: 完整 URL
        type: string
      group:
        allOf:
          - $ref: "#/definitions/article.GroupBrief"
        description: 所属目录分组（= 分类，精简）
      group_id:
        description: 所属目录分组节点 ID
        type: integer
      id:
        description: 文章 ID
        example: 1
        type: integer
      path:
        description: 相对子路径
        type: string
      published_at:
        description: 发布时间，未发布为空
        format: date-time
        type: string
      slug:
        description: URL 友好标识，空间内唯一
        example: hello-world
        type: string
      space_id:
        description: 所属内容空间 ID
        example: 1
        type: integer
      status:
        allOf:
          - $ref: "#/definitions/article.Status"
        description: 状态：draft / published
        example: published
      tag_ids:
        description: 关联标签 ID 列表
        items:
          type: integer
        type: array
      tags:
        description: 关联标签（精简）
        items:
          $ref: "#/definitions/article.TagBrief"
        type: array
      translations:
        description: 全部语言翻译
        items:
          $ref: "#/definitions/article.TranslationView"
        type: array
      updated_at:
        description: 更新时间
        format: date-time
        type: string
      workspace_id:
        description: 所属 Workspace ID
        example: 1
        type: integer
    type: object
  article.ArticleDirectoryNode:
    properties:
      article_id:
        description: |-
          ArticleID 仅 kind=article 非空；(space_id, article_id) 唯一 → 一文最多入树一次。
          NULL 不计入唯一约束，故多个 group 节点可并存。
        type: integer
      collapsed:
        description: 是否默认折叠（仅分组有意义）
        example: false
        type: boolean
      created_at:
        description: 创建时间
        type: string
      id:
        description: 节点 ID
        example: 1
        type: integer
      kind:
        allOf:
          - $ref: "#/definitions/article.DirNodeKind"
        description: 节点类型：group 分组 / article 文章
        example: group
      parent_id:
        description: 父节点 ID，可为空（顶级）
        type: integer
      path:
        description: Path：分组聚合页相对 Space.base_url 的子路径（空间内唯一，service 层校验，与文章 path 同命名空间）。
        example: guides
        type: string
      slug:
        description: Slug：分组的正式 slug（空间内 group 唯一，service 层校验）；article 节点不用。
        example: getting-started
        type: string
      sort:
        description: 同级排序，越小越靠前
        example: 0
        type: integer
      space_id:
        description: 所属内容空间 ID
        example: 1
        type: integer
      updated_at:
        description: 更新时间
        type: string
      workspace_id:
        description: 所属 Workspace ID
        example: 1
        type: integer
    type: object
  article.ArticleDirectoryNodeTranslation:
    properties:
      created_at:
        description: 创建时间
        type: string
      lang:
        description: 语言代码
        example: zh-CN
        type: string
      name:
        description: 该语言下的分组标题
        example: 快速开始
        type: string
      node_id:
        description: 所属节点 ID
        example: 1
        type: integer
      updated_at:
        description: 更新时间
        type: string
    type: object
  article.ArticleListView:
    properties:
      author:
        allOf:
          - $ref: "#/definitions/manager-backend_modules_author.AuthorView"
        description: 关联作者（按 lang 内嵌；开放面无独立作者接口，靠此直接展示；作者被删则空）
      author_id:
        description: 关联作者 ID（admin 前端可经作者库 store join）
        type: integer
      coverage:
        allOf:
          - $ref: "#/definitions/article.LangCoverage"
        description: 语言覆盖（相对空间 SupportedLangs：covered/missing）
      created_at:
        description: 创建时间
        format: date-time
        type: string
      created_by_staff_id:
        description: 创建者 staff ID
        example: 1
        type: integer
      full_url:
        description: 完整 URL = Space.base_url + '/' + path
        type: string
      group:
        allOf:
          - $ref: "#/definitions/article.GroupBrief"
        description: 所属目录分组（= 分类，精简）
      id:
        description: 文章 ID
        example: 1
        type: integer
      langs:
        description: 已有翻译的语言列表
        items:
          type: string
        type: array
      path:
        description: 相对子路径
        type: string
      primary_cover_url:
        description: 主翻译封面图 URL
        type: string
      primary_summary:
        description: 主翻译摘要
        type: string
      primary_translation:
        allOf:
          - $ref: "#/definitions/article.TranslationBrief"
        description: 主翻译（用于列表标题展示）
      published_at:
        description: 发布时间，未发布为空
        format: date-time
        type: string
      slug:
        description: URL 友好标识，空间内唯一
        example: hello-world
        type: string
      space_id:
        description: 所属内容空间 ID
        example: 1
        type: integer
      status:
        allOf:
          - $ref: "#/definitions/article.Status"
        description: 状态：draft / published
        example: published
      tags:
        description: 关联标签（精简）
        items:
          $ref: "#/definitions/article.TagBrief"
        type: array
      updated_at:
        description: 更新时间
        format: date-time
        type: string
    type: object
  article.ArticleTag:
    properties:
      created_at:
        description: 创建时间
        type: string
      id:
        description: 标签 ID
        example: 1
        type: integer
      path:
        description: 前台聚合页相对 URL，可为空
        example: tag/golang
        type: string
      slug:
        description: URL 友好标识，空间内唯一
        example: golang
        type: string
      space_id:
        description: 所属内容空间 ID
        example: 1
        type: integer
      updated_at:
        description: 更新时间
        type: string
      workspace_id:
        description: 所属 Workspace ID
        example: 1
        type: integer
    type: object
  article.ArticleUpdateReq:
    properties:
      author_id:
        description: 关联作者 ID（提供则设置/更换作者）
        type: integer
      clear_author:
        description: 置为 true 时清空作者
        type: boolean
      clear_group:
        description: 置为 true 时把文章移出目录树（未分类）
        type: boolean
      clear_path:
        description: 已废弃：path 必填，置 true 会返回校验错误
        type: boolean
      clear_published_at:
        description: 置为 true 时清空 published_at
        type: boolean
      group_id:
        description: 目录分组节点 ID（提供则把文章放/移到该分组）
        type: integer
      path:
        description: 相对子路径（不可为空；提供须非空）
        type: string
      published_at:
        description: 发布时间
        type: string
      slug:
        description: URL 友好标识
        example: hello-world
        type: string
      status:
        allOf:
          - $ref: "#/definitions/article.Status"
        description: 状态：draft / published
        example: published
      tag_ids:
        description: 关联标签 ID 列表（整组覆盖）
        items:
          type: integer
        type: array
    type: object
  article.BodyFormat:
    enum:
      - markdown
      - html
      - json
    type: string
    x-enum-comments:
      BodyHTML: 正文源为 HTML
      BodyJSON: 正文源为 JSON（结构化）
      BodyMarkdown: 正文源为 Markdown
    x-enum-varnames:
      - BodyMarkdown
      - BodyHTML
      - BodyJSON
  article.CoAuthor:
    properties:
      name:
        description: 协作者名称
        example: Claude
        type: string
      type:
        description: 协作者类型：ai / human，缺省 ai
        enum:
          - ai
          - human
        example: ai
        type: string
    type: object
  article.DirArticleBrief:
    properties:
      id:
        description: 文章 ID
        example: 1
        type: integer
      slug:
        description: slug
        example: hello-world
        type: string
      status:
        allOf:
          - $ref: "#/definitions/article.Status"
        description: 状态：draft / published
        example: draft
      title:
        description: 标题
        example: 你好世界
        type: string
    type: object
  article.DirNodeCreateReq:
    properties:
      article_id:
        description: 指向的文章 ID（kind=article 必填）
        type: integer
      collapsed:
        description: 是否默认折叠
        example: false
        type: boolean
      group_name:
        description: 分组标题（kind=group 必填）
        example: 快速开始
        type: string
      kind:
        allOf:
          - $ref: "#/definitions/article.DirNodeKind"
        description: 节点类型：group / article（必填）
        example: group
      lang:
        description: 初始翻译语言（kind=group 必填）
        example: zh-CN
        type: string
      parent_id:
        description: 父节点 ID，可为空（顶级）
        type: integer
      path:
        description: 分组落地页相对 URL（kind=group 可选）
        example: guides
        type: string
      slug:
        description: 分组 slug（kind=group 可选，空间内唯一）
        example: getting-started
        type: string
    required:
      - kind
    type: object
  article.DirNodeKind:
    enum:
      - group
      - article
    type: string
    x-enum-comments:
      DirKindArticle: 文章节点（指向一篇文章）
      DirKindGroup: 分组节点（可含子节点，聚合页）
    x-enum-varnames:
      - DirKindGroup
      - DirKindArticle
  article.DirNodeUpdateReq:
    properties:
      clear_path:
        description: 置为 true 时清空 path
        type: boolean
      clear_slug:
        description: 置为 true 时清空 slug
        type: boolean
      collapsed:
        description: 是否默认折叠
        type: boolean
      path:
        description: 分组落地页相对 URL
        example: guides
        type: string
      slug:
        description: 分组 slug
        example: getting-started
        type: string
    type: object
  article.DirNodeView:
    properties:
      article_count:
        description: 递归文章数量（含子分组、排除软删/悬空）
        example: 5
        type: integer
      article_id:
        description: article 节点
        type: integer
      child_group_count:
        description: group 节点懒加载计数（仅 group 节点；ListChildren 填充）
        example: 2
        type: integer
      children:
        description: 子节点
        items:
          $ref: "#/definitions/article.DirNodeView"
        type: array
      collapsed:
        description: 是否默认折叠
        example: false
        type: boolean
      full_url:
        description: 文章完整 URL（仅 article 节点）
        type: string
      group_full_url:
        description: 分组落地页完整 URL（仅 group 且有 path）
        type: string
      id:
        description: 节点 ID
        example: 1
        type: integer
      kind:
        allOf:
          - $ref: "#/definitions/article.DirNodeKind"
        description: 节点类型：group / article
        example: group
      parent_id:
        description: 父节点 ID
        type: integer
      path:
        description: 分组落地页相对 URL
        example: guides
        type: string
      published_at:
        description: 文章发布时间（仅 article 节点）
        type: string
      slug:
        description: 分组 slug
        example: getting-started
        type: string
      sort:
        description: 同级排序
        example: 0
        type: integer
      status:
        allOf:
          - $ref: "#/definitions/article.Status"
        description: 文章状态（仅 article 节点）
        example: published
      title:
        description: 通用：group=分组名 fallback；article=文章标题 fallback
        example: 快速开始
        type: string
      translations:
        description: group 节点多语言（admin 编辑用）
        items:
          $ref: "#/definitions/article.ArticleDirectoryNodeTranslation"
        type: array
    type: object
  article.DirReorderItem:
    properties:
      id:
        description: 节点 ID（必填）
        example: 1
        type: integer
      parent_id:
        description: 新父节点 ID，可为空（顶级）
        type: integer
      sort:
        description: 新的同级排序
        example: 0
        type: integer
    required:
      - id
    type: object
  article.DirReorderReq:
    properties:
      items:
        description: 重排项列表（必填）
        items:
          $ref: "#/definitions/article.DirReorderItem"
        type: array
    required:
      - items
    type: object
  article.DirStaffView:
    properties:
      tree:
        description: 目录树（嵌套）
        items:
          $ref: "#/definitions/article.DirNodeView"
        type: array
      unplaced:
        description: 未归入目录树的文章
        items:
          $ref: "#/definitions/article.DirArticleBrief"
        type: array
    type: object
  article.FeedDescriptor:
    properties:
      feed_url:
        example: https://www.example.com/api/open/v1/rss?space=blog&lang=en
        type: string
      lang:
        example: en
        type: string
    type: object
  article.FeedbackReq:
    properties:
      contact:
        description: 可选联系方式
        example: me@example.com
        type: string
      content:
        description: 反馈正文（必填）
        example: 这一段链接失效了
        type: string
      ip:
        description: 终端访客 IP（业务传入；空则回退 ClientIP）
        example: 203.0.113.7
        type: string
      lang:
        description: 所在语言版本
        example: zh-CN
        type: string
      meta:
        description: 业务透传身份上下文
        example: vip:gold
        type: string
      rating:
        description: 提交时的打分快照（可选）
        example: 4
        type: integer
      user_agent:
        description: 终端 UA（业务传入；空则回退请求头）
        type: string
      visitor_id:
        description: 访客标识，可空
        example: v-abc123
        type: string
      vote:
        description: 提交时的赞踩快照（可选）
        example: 1
        type: integer
    required:
      - content
    type: object
  article.FeedbackStatus:
    enum:
      - open
      - resolved
      - ignored
    type: string
    x-enum-comments:
      FeedbackIgnored: 已忽略
      FeedbackOpen: 待处理（默认）
      FeedbackResolved: 已处理
    x-enum-varnames:
      - FeedbackOpen
      - FeedbackResolved
      - FeedbackIgnored
  article.FeedbackStatusReq:
    properties:
      status:
        allOf:
          - $ref: "#/definitions/article.FeedbackStatus"
        description: open/resolved/ignored
        example: resolved
    required:
      - status
    type: object
  article.FeedbackSummary:
    properties:
      down_count:
        description: 点踩数
        example: 2
        type: integer
      feedback_count:
        description: 文本反馈条数
        example: 5
        type: integer
      my_reaction:
        allOf:
          - $ref: "#/definitions/article.MyReaction"
        description: 当前访客的反应（带 visitor_id 时）
      rating_avg:
        description: 平均分（仅计 rating>0）
        example: 4.2
        type: number
      rating_count:
        description: 评分人数
        example: 15
        type: integer
      rating_dist:
        description: 1–5 各分桶计数（下标 0=1星）
        items:
          type: integer
        type: array
      up_count:
        description: 点赞数
        example: 30
        type: integer
    type: object
  article.FeedbackView:
    properties:
      article_id:
        description: 被反馈的文章 ID
        example: 1
        type: integer
      article_title:
        description: 文章标题（按 zh-CN fallback 取）
        example: 你好世界
        type: string
      contact:
        description: 访客留下的联系方式，可空
        example: me@example.com
        type: string
      content:
        description: 反馈正文
        example: 这一段链接失效了
        type: string
      created_at:
        description: 提交时间
        format: date-time
        type: string
      handled_at:
        description: 处理时间，未处理为空
        format: date-time
        type: string
      handled_by_staff_id:
        description: 处理该反馈的 staff ID，未处理为 0
        example: 1
        type: integer
      id:
        description: 反馈记录 ID
        example: 1
        type: integer
      ip:
        description: 终端访客 IP
        example: 203.0.113.7
        type: string
      lang:
        description: 反馈所在的语言版本
        example: zh-CN
        type: string
      meta:
        description: 业务透传身份上下文
        example: vip:gold
        type: string
      rating_snapshot:
        description: 提交时的打分快照（1–5，0=未打分）
        example: 4
        type: integer
      space_id:
        description: 所属内容空间 ID
        example: 1
        type: integer
      status:
        allOf:
          - $ref: "#/definitions/article.FeedbackStatus"
        description: 处理状态：open 待处理 / resolved 已处理 / ignored 已忽略
        example: open
      updated_at:
        description: 更新时间
        format: date-time
        type: string
      user_agent:
        description: 浏览器/设备 UA
        type: string
      visitor_id:
        description: 访客标识（前台 cookie UUID 或自定义用户标识），可空
        example: v-abc123
        type: string
      vote_snapshot:
        description: 提交时的赞踩快照（-1 踩 / 1 赞 / 0 未投票）
        example: 1
        type: integer
      workspace_id:
        description: 所属 Workspace ID
        example: 1
        type: integer
    type: object
  article.GroupBrief:
    properties:
      full_url:
        description: 分组聚合页完整 URL（Space.base_url + '/' + path），无 path 则空
        type: string
      id:
        description: 分组（目录节点）ID
        example: 1
        type: integer
      name:
        description: 当前语言下的分组名
        example: 使用指南
        type: string
      slug:
        description: 分组 slug
        example: guides
        type: string
    type: object
  article.LangCoverage:
    properties:
      covered:
        description: 已有译文且 ∈ SupportedLangs 的语言
        items:
          type: string
        type: array
      missing:
        description: SupportedLangs 中尚无译文的语言
        items:
          type: string
        type: array
    type: object
  article.MyReaction:
    properties:
      rating:
        description: 0–5
        example: 4
        type: integer
      vote:
        description: -1 / 0 / 1
        example: 1
        type: integer
    type: object
  article.PinAddReq:
    properties:
      article_id:
        description: 文章 ID
        example: 1
        type: integer
    required:
      - article_id
    type: object
  article.PinReorderItem:
    properties:
      article_id:
        description: 文章 ID
        example: 1
        type: integer
      sort:
        description: 新顺序，越小越靠前
        example: 0
        type: integer
    required:
      - article_id
    type: object
  article.PinReorderReq:
    properties:
      items:
        description: 重排项列表
        items:
          $ref: "#/definitions/article.PinReorderItem"
        type: array
    required:
      - items
    type: object
  article.PubArticleView:
    properties:
      author:
        allOf:
          - $ref: "#/definitions/manager-backend_modules_author.AuthorView"
        description: 作者（仅详情内嵌，按 lang 解析；供前台展示）
      available_langs:
        description: 可用语言列表（仅详情返回）
        items:
          type: string
        type: array
      body_html:
        description: 渲染后的 HTML 正文（仅详情返回）
        type: string
      cover_alt:
        description: 封面图替代文本
        type: string
      cover_url:
        description: 封面图 URL
        type: string
      coverage:
        allOf:
          - $ref: "#/definitions/article.LangCoverage"
        description: 语言覆盖（相对空间 SupportedLangs：covered/missing）
      created_at:
        description: 创建时间
