      tags:
        - 网站检测
  /sitecheck/tasks/{id}/stats:
    get:
      description: 🔑 只读 key · viewer+ ｜ 返回任务结果的分类计数（内/外链、图片、js、css），按结果实时统计
      parameters:
        - description: 检测任务 ID
          in: path
          name: id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/internal.PageStats"
                type: object
      security:
        - ApiKeyAuth: []
      summary: 检测结果统计
      tags:
        - 网站检测
  /sitecheck/tasks/{id}/stop:
    post:
      description: 🔑 可写 key · editor+ ｜ 停止一个运行中的检测任务
      parameters:
        - description: 检测任务 ID
          in: path
          name: id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/framework.Response"
      security:
        - ApiKeyAuth: []
      summary: 停止检测任务
      tags:
        - 网站检测
  /sort-setting:
    get:
      description: 🔑 只读 key · 需 content:<visibility> ｜ 返回内容空间的非置顶默认排序策略（未配置回落 directory）
      parameters:
        - description: 内容空间 slug
          in: query
          name: space
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/article.SortSettingView"
                type: object
      security:
        - ApiKeyAuth: []
      summary: 获取默认排序策略
      tags:
        - 文章-置顶
    put:
      consumes:
        - application/json
      description: 🔑 可写 key · editor+ ｜
        设置非置顶默认排序策略（directory/published_desc/published_asc/updated_desc/updated_asc）
      parameters:
        - description: 内容空间 slug
          in: query
          name: space
          required: true
          type: string
        - description: 请求体
          in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/article.SortSettingReq"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/framework.Response"
      security:
        - ApiKeyAuth: []
      summary: 设置默认排序策略
      tags:
        - 文章-置顶
  /space/feeds:
    get:
      description: 🔑 只读 key · 按 scopes 可见性 ｜ 返回该内容空间可订阅的多语言 RSS feed 列表（语言 = 声明支持 ∩
        至少一篇已发布译文；未声明则取有已发布译文的语言）。feed_url 在工作空间已配域名时为绝对 URL，否则为相对路径。
      parameters:
        - description: 内容空间标识（slug 或 ID）
          in: query
          name: space
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/article.SpaceFeedsView"
                type: object
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/framework.Response"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/framework.Response"
      security:
        - ApiKeyAuth: []
      summary: 可订阅 feed 列表（多语言）
      tags:
        - 文章
  /upload:
    post:
      consumes:
        - multipart/form-data
      description: 🔑 可写 key · editor+ ｜ 服务账号（含 AI / MCP 配图）上传文件到该 workspace 配的 S3；不落库
      parameters:
        - description: 文件
          in: formData
          name: file
          required: true
          type: file
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/workspace.UploadResp"
                type: object
      security:
        - ApiKeyAuth: []
      summary: 上传素材
      tags:
        - 素材
  /web-files:
    get:
      description: 🔑 只读 key · 需 webfile:public ｜ 列出当前 workspace 下的文件（元信息 + 公开 URL）
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    items:
                      $ref: "#/definitions/internal.PubWebFileBrief"
                    type: array
                type: object
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/framework.Response"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/framework.Response"
      security:
        - ApiKeyAuth: []
      summary: 列出文本/文件
      tags:
        - 文件
    post:
      consumes:
        - application/json
      description: 🔑 可写 key · editor+ ｜ 以 JSON 创建一条文本文件记录（name + url_path + 文本内容）
      parameters:
        - description: 创建参数
          in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/internal.WebFileCreateReq"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/internal.WebFile"
                type: object
      security:
        - ApiKeyAuth: []
      summary: 创建文本文件（服务账号）
      tags:
        - 文件
  /web-files/by-path:
    get:
      description: 🔑 只读 key · 需 webfile:public ｜ 按 url_path 从 S3 流式回源返回文件字节（带
        content-type 与 ETag/Cache-Control）
      parameters:
        - description: 文件 url_path，如 /robots.txt
          in: query
          name: path
          required: true
          type: string
        - description: 语言码（如 zh-CN/en）；回退链：请求语→全局→zh-CN
          in: query
          name: lang
          type: string
      produces:
        - application/octet-stream
      responses:
        "200":
          description: 文件内容
          schema:
            type: string
        "304":
          description: 未修改（命中 If-None-Match）
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/framework.Response"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/framework.Response"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/framework.Response"
      security:
        - ApiKeyAuth: []
      summary: 取回文件内容
      tags:
        - 文件
  /web-files/upload:
    post:
      consumes:
        - multipart/form-data
      description: 🔑 可写 key · editor+ ｜ multipart 上传任意文件（二进制/文本均可）
      parameters:
        - description: 文件
          in: formData
          name: file
          required: true
          type: file
        - description: 展示名
          in: formData
          name: name
          type: string
        - description: 逻辑路径
          in: formData
          name: url_path
          type: string
        - description: 语言码（空=全局；非空如 zh-CN/en）
          in: formData
          name: lang
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/internal.WebFile"
                type: object
      security:
        - ApiKeyAuth: []
      summary: 上传文件（服务账号）
      tags:
        - 文件
  /web-files/{id}:
    delete:
      description: 🔑 可写 key · editor+ ｜ 删除文件记录（S3 对象 + DB 行均硬删）
      parameters:
        - description: 文件 ID
          in: path
          name: id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/framework.Response"
      security:
        - ApiKeyAuth: []
      summary: 删除文件（服务账号）
      tags:
        - 文件
    get:
      description: 🔑 只读 key · 需 webfile:public ｜ 返回单条文件元信息；文本文件附带正文（scope 与列表一致，防越权按
        ID 读正文）
      parameters:
        - description: 文件 ID
          in: path
          name: id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/internal.WebFileDetail"
                type: object
      security:
        - ApiKeyAuth: []
      summary: 文件详情（服务账号）
      tags:
        - 文件
    patch:
      consumes:
        - application/json
      description: 🔑 可写 key · editor+ ｜ 部分更新 name/url_path/sort；改 url_path 搬迁底层对象
      parameters:
        - description: 文件 ID
          in: path
          name: id
          required: true
          type: integer
        - description: 更新参数
          in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/internal.WebFileUpdateReq"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/internal.WebFile"
                type: object
      security:
        - ApiKeyAuth: []
      summary: 更新文件元信息（服务账号）
      tags:
        - 文件
  /web-files/{id}/content:
    put:
      consumes:
        - application/json
      description: 🔑 可写 key · editor+ ｜ 覆盖保存可编辑文本文件的正文（仅 is_text）
      parameters:
        - description: 文件 ID
          in: path
          name: id
          required: true
          type: integer
        - description: 正文
          in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/internal.WebFileContentReq"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/internal.WebFile"
                type: object
      security:
        - ApiKeyAuth: []
      summary: 保存文件正文（服务账号）
      tags:
        - 文件
  /whoami:
    get:
      description: 🔑 只读 key · viewer+ ｜ 服务账号通过 X-API-Key 获取所属 workspace 基本信息、当前 key
        角色与授权 scopes（用于发现 wid、自查角色/可见性能力，避免撞 403）
      parameters:
        - description: Workspace API Key
          in: header
          name: X-API-Key
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/workspace.SvcWhoamiView"
                type: object
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/framework.Response"
      security:
        - ApiKeyAuth: []
      summary: 服务账号 whoami（含角色）
      tags:
        - 账号
  /workspace:
    get:
      consumes:
        - application/json
      description: 🔑 只读 key · viewer+ ｜ 业务方通过 X-API-Key 获取所属 workspace 的基本信息
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/workspace.PubWorkspaceView"
                type: object
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/framework.Response"
      security:
        - ApiKeyAuth: []
      summary: 公开 whoami
      tags:
        - 账号
securityDefinitions:
  ApiKeyAuth:
    description: 内容中台 pub 接口的接入凭证（在后台 workspace 下签发）。
    in: header
    name: X-API-Key
    type: apiKey
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
  - description: 文章的消费读（已发布）与管理读写（含草稿、翻译）。
    name: 文章
  - description: 文章分类的消费读与管理读写（含多语言翻译）。
    name: 分类
  - description: 文章标签的消费读与管理读写（含多语言翻译）。
    name: 标签
  - description: 导航目录树的消费读与管理读写（节点、重排、分组翻译）。
    name: 目录
  - description: 内容空间（ContentSpace）的消费读与管理读写。
    name: 内容空间
  - description: 已发布 API 文档的列表与 OpenAPI 原文（只读消费）。
    name: API 文档
  - description: 网站检测任务的管理读写（创建/停止/重跑/删除任务、逐 URL 抓取结果与 SEO）。
    name: 网站检测
  - description: 对象存储素材上传（含 AI / MCP 配图）。
    name: 素材
  - description: API Key 的 whoami：所属 workspace 与（服务账号）角色。
    name: 账号
