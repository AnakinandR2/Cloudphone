  /sitecheck/tasks/{id}/pages/{pid}:
    get:
      description: 🔑 只读 key · viewer+ ｜ 返回单条抓取结果详情（含 SEO 解析）
      parameters:
        - description: 检测任务 ID
          in: path
          name: id
          required: true
          type: integer
        - description: 结果页 ID
          in: path
          name: pid
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/internal.Page"
                type: object
      security:
        - ApiKeyAuth: []
      summary: 检测结果页详情（管理）
      tags:
        - 网站检测
  /sitecheck/tasks/{id}/report:
    get:
      description: 🔑 只读 key · viewer+ ｜ 返回任务的页面级聚合报告（状态码分布、SEO 问题汇总等）。
      parameters:
        - description: 检测任务 ID
          in: path
          name: id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/framework.Response"
              - properties:
                  data:
                    $ref: "#/definitions/internal.PageReport"
                type: object
      security:
        - ApiKeyAuth: []
      summary: 任务聚合报告
      tags:
        - 网站检测
  /sitecheck/tasks/{id}/rerun:
    post:
      description: 🔑 可写 key · editor+ ｜ 克隆指定任务的配置并启动一个新任务
      parameters:
        - description: 检测任务 ID
          in: path
          name: id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
