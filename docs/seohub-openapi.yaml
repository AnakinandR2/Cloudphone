        type: array
      slug:
        description: 工作空间唯一标识
        example: acme
        type: string
      workspace_id:
        description: 工作空间ID（对外开放面由 key 注入，无需在路径传）
        example: 1
        type: integer
    type: object
  workspace.UploadResp:
    properties:
      mime:
