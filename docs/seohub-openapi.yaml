        example: image/png
        type: string
      object_key:
        description: 写入对象存储的对象键
        example: assets/x.png
        type: string
      size:
        description: 文件字节大小
        example: 20480
        type: integer
      url:
        description: 可公开访问的完整 URL
        example: https://cdn.example.com/acme/assets/x.png
        type: string
    type: object
